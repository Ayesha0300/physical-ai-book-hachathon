openapi: 3.0.0
info:
  title: RAG Chatbot API
  description: API for the RAG (Retrieval-Augmented Generation) Chatbot system
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /chat:
    post:
      summary: Process a user query and return an AI-generated response
      description: |
        Sends a user query to the AI agent which retrieves relevant information
        from the vector database to generate a grounded response based on book content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response with AI-generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSuccessResponse'
        '400':
          description: Bad request - invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatErrorResponse'
      tags:
        - chat
components:
  schemas:
    ChatRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user's question or request
          example: "What are the key principles of RAG systems?"
          minLength: 1
          maxLength: 2000
        selected_text:
          type: string
          description: Specific text selected by the user for context
          example: "Retrieval-Augmented Generation combines retrieval and generation..."
          maxLength: 10000
        restrict_to_selection:
          type: boolean
          description: Whether to limit responses to selected text
          default: false
        conversation_id:
          type: string
          description: ID for maintaining conversation context
          example: "conv_abc123xyz"
      example:
        query: "What are the key principles of RAG systems?"
        selected_text: "Retrieval-Augmented Generation combines retrieval and generation..."
        restrict_to_selection: true
        conversation_id: "conv_abc123xyz"

    ChatSuccessResponse:
      type: object
      required:
        - success
        - data
        - request_id
      properties:
        success:
          type: boolean
          enum: [true]
          description: Indicates successful request
        data:
          $ref: '#/components/schemas/ChatResponse'
        request_id:
          type: string
          description: Unique identifier for the request
          example: "req_def456uvw"

    ChatErrorResponse:
      type: object
      required:
        - success
        - error
        - request_id
      properties:
        success:
          type: boolean
          enum: [false]
          description: Indicates failed request
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: "INVALID_QUERY"
            message:
              type: string
              description: Human-readable error message
              example: "Query must be provided and cannot be empty"
            details:
              type: object
              description: Additional error details
              example:
                field: "query"
                reason: "Field is required"
        request_id:
          type: string
          description: Unique identifier for the request
          example: "req_def456uvw"

    ChatResponse:
      type: object
      required:
        - response
        - conversation_id
      properties:
        response:
          type: string
          description: The AI-generated answer
          example: "RAG systems combine retrieval mechanisms with generative models..."
        sources:
          type: array
          items:
            type: string
          description: List of document sources used
          example: ["document_001", "document_005"]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score of the response
          example: 0.85
        conversation_id:
          type: string
          description: ID for conversation continuity
          example: "conv_abc123xyz"
        timestamp:
          type: string
          format: date-time
          description: When the response was generated
          example: "2026-01-15T10:30:00Z"

tags:
  - name: chat
    description: Chatbot interaction endpoints